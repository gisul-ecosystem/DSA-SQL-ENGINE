groups:
  - name: execution-engine
    rules:
      - alert: ApiHigh5xxRate
        expr: sum(rate(execution_engine_api_requests_total{status_code=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API 5xx rate is high

      - alert: QueueDepthHigh
        expr: execution_engine_queue_depth{language="total"} > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Execution queue depth is high

      - alert: QueueWaitHigh
        expr: histogram_quantile(0.95, sum(rate(execution_engine_worker_queue_wait_seconds_bucket[5m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: p95 queue wait is above 30 seconds

      - alert: WorkersNotProcessing
        expr: sum(execution_engine_queue_depth) > 0 and sum(rate(execution_engine_worker_jobs_total[5m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Queue is non-empty but workers are not completing jobs

      - alert: DockerPoolLowHitRate
        expr: |
          (
            sum(rate(execution_engine_docker_pool_events_total{event="hit"}[10m]))
            /
            clamp_min(sum(rate(execution_engine_docker_pool_events_total{event=~"hit|miss"}[10m])), 1)
          ) < 0.2
        for: 20m
        labels:
          severity: info
        annotations:
          summary: Warm pool hit rate is low

      - alert: JobTimeoutRateHigh
        expr: sum(rate(execution_engine_pipeline_verdicts_total{verdict="runtime_error"}[5m])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Runtime error rate is elevated
