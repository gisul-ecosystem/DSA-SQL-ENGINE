name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: gisuldocker/execution-engine-py:latest

  deploy:
    needs: build
    runs-on: engines
    env:
      IMAGE: gisuldocker/execution-engine-py:latest
      SANDBOX_HOST_PATH: ${{ secrets.SANDBOX_HOST_PATH }}
      WORKER_SCALE: ${{ vars.WORKER_SCALE || '2' }}
      WORKER_CONCURRENCY: ${{ vars.WORKER_CONCURRENCY || '8' }}
      DOCKER_RUN_CONCURRENCY: ${{ vars.DOCKER_RUN_CONCURRENCY || '6' }}
      COMPILE_CONCURRENCY: ${{ vars.COMPILE_CONCURRENCY || '3' }}
      WARM_CONTAINER_TTL_SECONDS: ${{ vars.WARM_CONTAINER_TTL_SECONDS || '300' }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        shell: bash
        run: docker pull "$IMAGE"

      - name: Checkout repo (needed for docker-compose.yml)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed sandbox image inputs
        id: sandbox_changes
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"

          python=0
          js=0
          java=0
          kotlin=0
          cpp=0
          go=0
          rust=0
          csharp=0

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            python=1
            js=1
            java=1
            kotlin=1
            cpp=1
            go=1
            rust=1
            csharp=1
          else
            mapfile -t changed_files < <(git diff --name-only "${base_sha}" "${head_sha}")

            for path in "${changed_files[@]}"; do
              case "${path}" in
                docker/python.Dockerfile)
                  python=1
                  ;;
                docker/js.Dockerfile)
                  js=1
                  ;;
                docker/java.Dockerfile)
                  java=1
                  ;;
                docker/kotlin.Dockerfile)
                  kotlin=1
                  ;;
                docker/cpp.Dockerfile|docker/cpp_support.hpp)
                  cpp=1
                  ;;
                docker/go.Dockerfile)
                  go=1
                  ;;
                docker/rust.Dockerfile)
                  rust=1
                  ;;
                docker/csharp.Dockerfile)
                  csharp=1
                  ;;
              esac
            done
          fi

          any=0
          for flag in "$python" "$js" "$java" "$kotlin" "$cpp" "$go" "$rust" "$csharp"; do
            if [[ "$flag" == "1" ]]; then
              any=1
              break
            fi
          done

          {
            echo "any=${any}"
            echo "python=${python}"
            echo "js=${js}"
            echo "java=${java}"
            echo "kotlin=${kotlin}"
            echo "cpp=${cpp}"
            echo "go=${go}"
            echo "rust=${rust}"
            echo "csharp=${csharp}"
          } >> "$GITHUB_OUTPUT"

      - name: Detect missing sandbox images
        id: sandbox_images
        shell: bash
        run: |
          set -euo pipefail

          python=0
          js=0
          java=0
          kotlin=0
          cpp=0
          go=0
          rust=0
          csharp=0

          if ! docker image inspect python-sandbox:latest >/dev/null 2>&1; then python=1; fi
          if ! docker image inspect js-sandbox:latest >/dev/null 2>&1; then js=1; fi
          if ! docker image inspect java-sandbox:latest >/dev/null 2>&1; then java=1; fi
          kotlin=1
          if ! docker image inspect cpp-sandbox:latest >/dev/null 2>&1; then cpp=1; fi
          if ! docker image inspect go-sandbox:latest >/dev/null 2>&1; then go=1; fi
          if ! docker image inspect rust-sandbox:latest >/dev/null 2>&1; then rust=1; fi
          if ! docker image inspect csharp-sandbox:latest >/dev/null 2>&1; then csharp=1; fi

          any=0
          for flag in "$python" "$js" "$java" "$kotlin" "$cpp" "$go" "$rust" "$csharp"; do
            if [[ "$flag" == "1" ]]; then
              any=1
              break
            fi
          done

          {
            echo "any=${any}"
            echo "python=${python}"
            echo "js=${js}"
            echo "java=${java}"
            echo "kotlin=${kotlin}"
            echo "cpp=${cpp}"
            echo "go=${go}"
            echo "rust=${rust}"
            echo "csharp=${csharp}"
          } >> "$GITHUB_OUTPUT"

      - name: Build changed or missing sandbox images
        if: steps.sandbox_changes.outputs.any == '1' || steps.sandbox_images.outputs.any == '1'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.sandbox_changes.outputs.python }}" == "1" || "${{ steps.sandbox_images.outputs.python }}" == "1" ]]; then docker build -t python-sandbox:latest -f docker/python.Dockerfile .; fi
          if [[ "${{ steps.sandbox_changes.outputs.js }}"     == "1" || "${{ steps.sandbox_images.outputs.js }}"     == "1" ]]; then docker build -t js-sandbox:latest     -f docker/js.Dockerfile .;     fi
          if [[ "${{ steps.sandbox_changes.outputs.java }}"   == "1" || "${{ steps.sandbox_images.outputs.java }}"   == "1" ]]; then docker build -t java-sandbox:latest   -f docker/java.Dockerfile .;   fi
          if [[ "${{ steps.sandbox_changes.outputs.kotlin }}" == "1" || "${{ steps.sandbox_images.outputs.kotlin }}" == "1" ]]; then docker build -t kotlin-sandbox:latest -f docker/kotlin.Dockerfile .; fi
          if [[ "${{ steps.sandbox_changes.outputs.cpp }}"    == "1" || "${{ steps.sandbox_images.outputs.cpp }}"    == "1" ]]; then docker build -t cpp-sandbox:latest    -f docker/cpp.Dockerfile .;    fi
          if [[ "${{ steps.sandbox_changes.outputs.go }}"     == "1" || "${{ steps.sandbox_images.outputs.go }}"     == "1" ]]; then docker build -t go-sandbox:latest     -f docker/go.Dockerfile .;     fi
          if [[ "${{ steps.sandbox_changes.outputs.rust }}"   == "1" || "${{ steps.sandbox_images.outputs.rust }}"   == "1" ]]; then docker build -t rust-sandbox:latest   -f docker/rust.Dockerfile .;   fi
          if [[ "${{ steps.sandbox_changes.outputs.csharp }}" == "1" || "${{ steps.sandbox_images.outputs.csharp }}" == "1" ]]; then docker build -t csharp-sandbox:latest -f docker/csharp.Dockerfile .; fi

      - name: Skip sandbox rebuild
        if: steps.sandbox_changes.outputs.any != '1' && steps.sandbox_images.outputs.any != '1'
        shell: bash
        run: echo "No sandbox image changes or missing images detected"

      - name: Verify sandbox images exist
        shell: bash
        run: |
          set -euo pipefail

          docker image inspect python-sandbox:latest >/dev/null
          docker image inspect js-sandbox:latest >/dev/null
          docker image inspect java-sandbox:latest >/dev/null
          docker image inspect kotlin-sandbox:latest >/dev/null
          docker image inspect cpp-sandbox:latest >/dev/null
          docker image inspect go-sandbox:latest >/dev/null
          docker image inspect rust-sandbox:latest >/dev/null
          docker image inspect csharp-sandbox:latest >/dev/null

      - name: Deploy stack via docker compose
        shell: bash
        run: |
          set -euo pipefail
          : "${SANDBOX_HOST_PATH:?Set GitHub secret SANDBOX_HOST_PATH to a WSL/Linux path such as /home/<user>/judge-sandbox}"

          case "${SANDBOX_HOST_PATH}" in
            /run/desktop/mnt/host/*)
              echo "SANDBOX_HOST_PATH is set to a Windows-host mount: ${SANDBOX_HOST_PATH}" >&2
              echo "Use a native WSL/Linux path instead, e.g. /home/<user>/judge-sandbox" >&2
              exit 1
              ;;
          esac

          export HOST_SANDBOX_ROOT="${SANDBOX_HOST_PATH}"

          docker compose config >/dev/null
          docker compose up -d --no-build --remove-orphans --scale worker="${WORKER_SCALE:-10}"
