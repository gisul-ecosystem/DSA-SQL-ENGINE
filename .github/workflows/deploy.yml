name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: gisuldocker/execution-engine-py:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: gisuldocker/execution-engine-py:latest
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SANDBOX_HOST_PATH: ${{ secrets.SANDBOX_HOST_PATH }}
      WORKER_SCALE: ${{ vars.WORKER_SCALE || '2' }}
      WORKER_CONCURRENCY: ${{ vars.WORKER_CONCURRENCY || '8' }}
      DOCKER_RUN_CONCURRENCY: ${{ vars.DOCKER_RUN_CONCURRENCY || '6' }}
      COMPILE_CONCURRENCY: ${{ vars.COMPILE_CONCURRENCY || '3' }}
      WARM_CONTAINER_TTL_SECONDS: ${{ vars.WARM_CONTAINER_TTL_SECONDS || '300' }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload deploy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.yml,docker,observability,scripts/deploy-remote.sh"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          strip_components: 0

      - name: Deploy stack over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          SANDBOX_HOST_PATH: ${{ env.SANDBOX_HOST_PATH }}
          WORKER_SCALE: ${{ env.WORKER_SCALE }}
          WORKER_CONCURRENCY: ${{ env.WORKER_CONCURRENCY }}
          DOCKER_RUN_CONCURRENCY: ${{ env.DOCKER_RUN_CONCURRENCY }}
          COMPILE_CONCURRENCY: ${{ env.COMPILE_CONCURRENCY }}
          WARM_CONTAINER_TTL_SECONDS: ${{ env.WARM_CONTAINER_TTL_SECONDS }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE,DEPLOY_PATH,SANDBOX_HOST_PATH,WORKER_SCALE,WORKER_CONCURRENCY,DOCKER_RUN_CONCURRENCY,COMPILE_CONCURRENCY,WARM_CONTAINER_TTL_SECONDS,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script_stop: true
          script: |
            chmod +x "$DEPLOY_PATH/scripts/deploy-remote.sh"
            bash "$DEPLOY_PATH/scripts/deploy-remote.sh"
